peer_id: peer1
host: 100.80.215.111                       
iface: tailscale0                          
p2p_port: 9000
api_port: 8000
bootstrap_peers: ["100.65.100.119:9000"]     
db_path: data/peer1.db
model_path: models/iforest.joblib
whitelist: ["100.80.215.111", "100.65.100.119", "127.0.0.1"]   #TRÁNH BỊ CHẶN LẪN NHAU

rules:
  port_scan:
    window: 10
    distinct_ports: 20
  network_scan:
    window: 10
    distinct_hosts: 10
  ssh_brute:
    window: 60
    failures: 5
  flood:
    window: 5
    pps: 500
    syn_pps: 200
  cooldown: 60

ai:
  enabled: true
  threshold: 0.60

p2p:
  ping_interval: 5
  offline_timeout: 15
  alert_ttl: 3
  ack_timeout: 3
  max_retry: 3
